<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Cast Your Vote | Blockchain Voting</title>

  <link rel="stylesheet" href="../css/core.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/vote.css">

  <script type="module" src="../scripts/app.js"></script>
</head>

<body id="vote">
  <div class="background-grid"></div>

  <!-- HEADER -->
  <header class="top-header">
    <div class="header-left">
      <img src="../assets/emblem.svg" class="emblem" alt="Emblem">
      <div class="title-block">
        <h1>Electronic Voting System</h1>
        <span>Vote Casting Portal</span>
      </div>
    </div>

    <div class="status-pill online">SYSTEM ONLINE</div>
  </header>

  <!-- MAIN -->
  <main>
    <section class="panel">
      <h2>🗳️ Cast Your Vote</h2>

      <p class="note">
        Select one candidate.
        Each registered voter can vote <strong>only once</strong>.
      </p>

      <!-- Dynamic Grid -->
      <div id="voteGrid" class="vote-grid">
        <div class="status-msg">Loading candidates...</div>
      </div>

      <div id="voteStatus" class="status-msg"></div>

      <p class="note" style="margin-top: 40px; font-weight: 700; color: var(--warning);">
        ⚠️ Once submitted, a vote cannot be changed.
      </p>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    UG Final Year Project • Blockchain Voting • 2026
  </footer>
</body>

</html>
